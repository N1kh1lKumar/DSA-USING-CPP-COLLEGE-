
name: Sync LeetCode SQL Problems

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync-database:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout DSA repository
      - name: Checkout DSA repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Find SQL files only in the DSA repository
      - name: Find SQL problems
        id: find_sql
        shell: bash
        run: |
          if find . \
            -type f \
            -iname "*.sql" \
            -not -path "./.git/*" \
            -not -path "./database-repo/*" \
            -print -quit | grep -q .
          then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "No SQL problems found."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      # 3. Checkout SQL repository
      - name: Checkout SQL repository
        if: steps.find_sql.outputs.found == 'true'
        uses: actions/checkout@v4
        with:
          repository: N1kh1lKumar/MYSQL_JOURNEY
          token: ${{ secrets.DATABASE_REPO_TOKEN }}
          path: database-repo

      # 4. Copy only SQL files and remove only those files
      - name: Transfer SQL solutions
        if: steps.find_sql.outputs.found == 'true'
        shell: bash
        run: |
          set -e

          while IFS= read -r -d '' sql_file; do
            problem_dir=$(dirname "$sql_file")
            problem_name=$(basename "$problem_dir")
            sql_name=$(basename "$sql_file")

            destination="database-repo/$problem_name"

            echo "Transferring: $sql_file"
            echo "Destination: $destination/$sql_name"

            mkdir -p "$destination"

            # Copy only the SQL file.
            # Never delete the complete problem folder.
            cp "$sql_file" "$destination/$sql_name"

            # Remove only the SQL file from the DSA repository.
            git rm -- "$sql_file"

          done < <(
            find . \
              -type f \
              -iname "*.sql" \
              -not -path "./.git/*" \
              -not -path "./database-repo/*" \
              -print0
          )

      # 5. Commit SQL solutions to MYSQL_JOURNEY
      - name: Commit SQL repository
        if: steps.find_sql.outputs.found == 'true'
        working-directory: database-repo
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No SQL changes to commit."
          else
            git commit -m "Add LeetCode SQL solution"
            git push origin main
          fi

      # 6. Commit removal of SQL files from DSA repository
      - name: Commit DSA cleanup
        if: steps.find_sql.outputs.found == 'true'
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --cached --quiet; then
            echo "No SQL files to remove."
          else
            git commit -m "Move SQL solutions to MYSQL_JOURNEY"
            git push origin main
          fi
